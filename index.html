<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mete Marcha - Mobilidade</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #f4f4f4;
    }
    
    #map {
      height: 100vh;
      width: 100vw;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    
    /* Painel Estilo Uber */
    .bottom-panel {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 100%;
      max-width: 450px;
      background: #ffffff;
      padding: 20px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.15);
      max-height: 85vh;
      overflow-y: auto;
    }

    .drag-handle {
      width: 40px;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      margin: 0 auto 15px auto;
    }

    .panel-header {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 15px;
      color: #000;
    }
    
    .input-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }
    
    .input-box input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #eee;
      border-radius: 10px;
      font-size: 14px;
      background: #f6f6f6;
      outline: none;
    }

    .input-box input:focus {
      border-color: #000;
      background: #fff;
    }

    /* Lista Vertical de Veículos */
    .ride-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .ride-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ride-item:hover {
      background: #f9f9f9;
    }

    .ride-item.selected {
      border-color: #000;
      background: #fff;
    }

    .ride-info-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .ride-icon {
      font-size: 28px;
      width: 40px;
      text-align: center;
    }

    .ride-details h4 {
      font-size: 16px;
      font-weight: 700;
      color: #000;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ride-details p {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }

    .badge {
      display: inline-block;
      background: #276ef1;
      color: white;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 4px;
    }

    .ride-price {
      font-size: 17px;
      font-weight: 700;
      color: #000;
    }

    /* Rodapé de Pagamento e Ação */
    .payment-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-top: 1px solid #eee;
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background-color: #000000;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-calc {
      width: 100%;
      padding: 12px;
      background-color: #e0e0e0;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .leaflet-routing-container {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="bottom-panel">
    <div class="drag-handle"></div>
    <div class="panel-header">Escolher uma viagem</div>
    
    <div class="input-box">
      <input type="text" id="origin-input" placeholder="Ponto de Partida (ex: Av. Paulista, 1000)">
      <input type="text" id="destination-input" placeholder="Para onde vamos? (ex: Shopping Ibirapuera)">
    </div>

    <button class="btn-calc" onclick="calculateTrip()">🔍 Buscar Rota e Preços</button>

    <div class="ride-list">
      
      <div class="ride-item selected" onclick="selectOption(this)">
        <div class="ride-info-left">
          <div class="ride-icon">🚗</div>
          <div class="ride-details">
            <h4>Marcha X 👤4</h4>
            <p id="time-X">-- min est.</p>
          </div>
        </div>
        <div class="ride-price" id="price-X">R$ --</div>
      </div>

      <div class="ride-item" onclick="selectOption(this)">
        <div class="ride-info-left">
          <div class="ride-icon">🏍️</div>
          <div class="ride-details">
            <h4>Marcha Moto</h4>
            <p id="time-Moto">-- min est.</p>
          </div>
        </div>
        <div class="ride-price" id="price-Moto">R$ --</div>
      </div>

      <div class="ride-item" onclick="selectOption(this)">
        <div class="ride-info-left">
          <div class="ride-icon">🚘</div>
          <div class="ride-details">
            <h4>Comfort</h4>
            <p id="time-Comfort">-- min est.</p>
            <span class="badge">Mais rápido</span>
          </div>
        </div>
        <div class="ride-price" id="price-Comfort">R$ --</div>
      </div>

      <div class="ride-item" onclick="selectOption(this)">
        <div class="ride-info-left">
          <div class="ride-icon">🖤</div>
          <div class="ride-details">
            <h4>Black</h4>
            <p id="time-Black">-- min est.</p>
          </div>
        </div>
        <div class="ride-price" id="price-Black">R$ --</div>
      </div>

    </div>

    <div class="payment-bar">
      <span>💳 Apple Pay / Cartão</span>
      <span>❯</span>
    </div>

    <button class="btn-submit" onclick="confirmTrip()">Escolha Mete Marcha</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  
  <script>
    const map = L.map('map').setView([-23.55052, -46.633308], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const redCarIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/3202/3202003.png',
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });

    let routingControl = null;
    let distanceKm = 0;

    function selectOption(element) {
      document.querySelectorAll('.ride-item').forEach(item => item.classList.remove('selected'));
      element.classList.add('selected');
    }

    async function geocode(address) {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address + ', São Paulo, Brasil')}`;
      const response = await fetch(url);
      const data = await response.json();
      if (data && data.length > 0) {
        return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
      }
      return null;
    }

    async function calculateTrip() {
      const originText = document.getElementById('origin-input').value;
      const destText = document.getElementById('destination-input').value;

      if (!originText || !destText) {
        alert('Por favor, informe a origem e o destino!');
        return;
      }

      const originCoords = await geocode(originText);
      const destCoords = await geocode(destText);

      if (!originCoords || !destCoords) {
        alert('Endereço não localizado. Tente digitar de forma mais detalhada.');
        return;
      }

      if (routingControl) {
        map.removeControl(routingControl);
      }

      routingControl = L.Routing.control({
        waypoints: [
          L.latLng(originCoords[0], originCoords[1]),
          L.latLng(destCoords[0], destCoords[1])
        ],
        lineOptions: {
          styles: [{ color: '#000000', weight: 5 }]
        },
        createMarker: function(i, waypoint, n) {
          if (i === 0) return L.marker(waypoint.latLng, { icon: redCarIcon });
          return L.marker(waypoint.latLng);
        }
      }).addTo(map);

      routingControl.on('routesfound', function(e) {
        const routes = e.routes;
        const summary = routes[0].summary;
        
        distanceKm = summary.totalDistance / 1000;
        const baseTime = Math.round(summary.totalTime / 60);

        // Atualiza tempos
        document.getElementById('time-X').innerText = `${baseTime} min`;
        document.getElementById('time-Moto').innerText = `${Math.max(1, baseTime - 3)} min`;
        document.getElementById('time-Comfort').innerText = `${Math.max(1, baseTime - 2)} min`;
        document.getElementById('time-Black').innerText = `${baseTime} min`;

        // Cálculo de preços estilo Uber
        const pX = 5.00 + (distanceKm * 2.30);
        const pMoto = 3.00 + (distanceKm * 1.30);
        const pComfort = 7.00 + (distanceKm * 2.90);
        const pBlack = 10.00 + (distanceKm * 3.80);

        document.getElementById('price-X').innerText = `R$ ${pX.toFixed(2)}`;
        document.getElementById('price-Moto').innerText = `R$ ${pMoto.toFixed(2)}`;
        document.getElementById('price-Comfort').innerText = `R$ ${pComfort.toFixed(2)}`;
        document.getElementById('price-Black').innerText = `R$ ${pBlack.toFixed(2)}`;
      });
    }

    function confirmTrip() {
      if (distanceKm === 0) {
        alert('Calcule uma rota primeiro!');
        return;
      }
      alert('🚀 Viagem solicitada com sucesso! Procurando motorista próximo...');
    }
  </script>

</body>
</html>
