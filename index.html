<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mete Marcha - Mobilidade</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #e5e3df;
    }
    
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100%;
      width: 100%;
      z-index: 1;
    }
    
    .bottom-panel {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      padding: 16px 20px 24px 20px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.25);
      max-height: 85vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .drag-handle {
      width: 40px;
      height: 5px;
      background: #ccc;
      border-radius: 3px;
      margin: 0 auto 12px auto;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand-logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #111111;
      text-transform: uppercase;
    }

    .brand-logo span {
      color: #d32f2f;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .input-row {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      font-size: 14px;
      z-index: 2;
    }

    .input-box input {
      width: 100%;
      padding: 12px 14px 12px 36px;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      font-size: 14px;
      background: #f8f9fa;
      outline: none;
    }

    .input-box input:focus {
      border-color: #d32f2f;
      background: #fff;
    }

    .gps-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: #eee;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: #333;
    }

    .add-stop-btn {
      align-self: flex-start;
      background: none;
      border: none;
      color: #d32f2f;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-top: -2px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .add-stop-btn:hover {
      text-decoration: underline;
    }

    .stop-row {
      display: none;
    }

    .stop-row.active {
      display: flex;
    }

    .remove-stop-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: #ffcdd2;
      color: #b71c1c;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-calc {
      width: 100%;
      padding: 12px;
      background-color: #ffebee;
      color: #d32f2f;
      border: 1px solid #ffcdd2;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 15px;
      transition: all 0.2s;
    }

    .btn-calc:hover {
      background-color: #ffcdd2;
    }

    .btn-calc:disabled {
      background-color: #eee;
      color: #999;
      border-color: #ccc;
      cursor: not-allowed;
    }

    .ride-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .ride-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 2px solid #f0f0f0;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ride-item:hover {
      background: #fff5f5;
    }

    .ride-item.selected {
      border-color: #d32f2f;
      background: #fff5f5;
    }

    .ride-info-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ride-icon-box {
      font-size: 26px;
      width: 40px;
      text-align: center;
    }

    .ride-details h4 {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ride-details p {
      font-size: 12px;
      color: #666;
      margin-top: 1px;
    }

    .ride-details .sub-desc {
      font-size: 11px;
      color: #888;
    }

    .badge {
      display: inline-block;
      background: #d32f2f;
      color: white;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 3px;
    }

    .ride-price {
      font-size: 16px;
      font-weight: 800;
      color: #d32f2f;
    }

    .payment-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1px solid #eee;
      border-radius: 10px;
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      background: #fdfdfd;
      cursor: pointer;
      user-select: none;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer
