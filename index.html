<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mete Marcha - Mobilidade</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #e5e3df; }
    #map { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    .panel {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      z-index: 1000; width: 100%; max-width: 440px; background: #fff;
      padding: 16px; border-top-left-radius: 20px; border-top-right-radius: 20px;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.2); max-height: 80vh; overflow-y: auto;
    }
    .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .input-row { position: relative; display: flex; align-items: center; }
    .input-row input { width: 100%; padding: 10px 10px 10px 32px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
    .icon { position: absolute; left: 10px; font-size: 14px; z-index: 2; }
    .btn { width: 100%; padding: 12px; background: #d32f2f; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .leaflet-routing-container { display: none !important; }
    .car-emoji { display: inline-block; transform: rotate(90deg); font-size: 26px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="panel">
    <h2 style="margin-bottom: 12px; font-size: 20px;">METE <span style="color: #d32f2f;">MARCHA</span></h2>
    
    <div class="input-group">
      <div class="input-row">
        <span class="icon">🟢</span>
        <input type="text" id="origin" value="Itaquera, São Paulo">
      </div>
      <div class="input-row">
        <span class="icon">🔴</span>
        <input type="text" id="dest" value="Shopping Aricanduva, São Paulo">
      </div>
    </div>

    <button class="btn" onclick="searchRoute()">Buscar Rota e Preços</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  
  <script>
    // Focado na Zona Leste de SP
    const map = L.map('map', { zoomControl: false }).setView([-23.5431, -46.4673], 13);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    setTimeout(() => { map.invalidateSize(); }, 300);

    let routingControl = null;

    async function getCoords(address) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
        const data = await res.json();
        if (data && data.length > 0) return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
      } catch (e) {
        console.error(e);
      }
      return null;
    }

    async function searchRoute() {
      const origText = document.getElementById('origin').value;
      const destText = document.getElementById('dest').value;

      const origCoords = await getCoords(origText) || [-23.5431, -46.4673];
      const destCoords = await getCoords(destText) || [-23.5739, -46.5195];

      if (routingControl) map.removeControl(routingControl);

      routingControl = L.Routing.control({
        waypoints: [L.latLng(origCoords[0], origCoords[1]), L.latLng(destCoords[0], destCoords[1])],
        lineOptions: { styles: [{ color: '#d32f2f', weight: 6 }] },
        createMarker: (i, wp) => L.marker(wp.latLng)
      }).addTo(map);

      map.invalidateSize();
    }
  </script>

</body>
</html>
